<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Aviator Game</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: #000000;
		}

		canvas {
			display: block;
			max-width: 100%;
			height: 100%;
			width: 100%;
		}

		#canvas {
			width: 100%;
			height: 100%;
		}

		.loading {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #ffffff;
			font-family: Arial, sans-serif;
			text-align: center;
			z-index: 10;
		}

		.loading p {
			margin: 10px 0;
			font-size: 1.2rem;
		}

		.spinner {
			border: 4px solid rgba(255, 255, 255, 0.3);
			border-top: 4px solid #ffffff;
			border-radius: 50%;
			width: 40px;
			height: 40px;
			animation: spin 0.8s linear infinite;
			margin: 0 auto 20px;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}
			100% {
				transform: rotate(360deg);
			}
		}
	</style>
</head>
<body>
	<canvas id="canvas"></canvas>
	<div class="loading" id="loadingScreen">
		<div class="spinner"></div>
		<p>Loading Aviator...</p>
	</div>

	<!-- Export runner -->
	<script src="godot.js"></script>
	<script>
		const engine = new GodotHTML5Export();

		// Check if files exist before loading
		window.addEventListener("load", async function() {
			try {
				// Try to load the game
				await engine.init({
					executable: "aviator.html5",
					mainWindowHeight: window.innerHeight,
					mainWindowWidth: window.innerWidth,
					canvas: (function() {
						const canvas = document.getElementById('canvas');
						const ctx = canvas.getContext('2d');
						return canvas;
					})(),
					onProgress: function(current, total) {
						// Update loading progress if needed
					},
					onExecute: function(js_code) {
						// Code execution
						eval(js_code);
					},
					onExit: function(exit_code) {
						console.log("Game exited with code: " + exit_code);
						// Remove loading screen
						const loadingScreen = document.getElementById('loadingScreen');
						if (loadingScreen) {
							loadingScreen.style.display = 'none';
						}
					}
				});
				// Remove loading screen after game starts
				const loadingScreen = document.getElementById('loadingScreen');
				if (loadingScreen) {
					loadingScreen.style.display = 'none';
				}
			} catch (error) {
				const loadingScreen = document.getElementById('loadingScreen');
				if (loadingScreen) {
					loadingScreen.innerHTML = '<p>Error loading game. Please make sure all game files are in place.</p><p>' + error + '</p>';
				}
				console.error("Failed to load Godot game:", error);
			}
		});

		// Handle window resize
		window.addEventListener('resize', function() {
			if (engine) {
				// Adjust canvas size on resize
				const canvas = document.getElementById('canvas');
				canvas.width = window.innerWidth;
				canvas.height = window.innerHeight;
			}
		});
	</script>
</body>
</html>
